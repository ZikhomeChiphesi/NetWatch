services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_dev_password}
      POSTGRES_DB: netwatch

    volumes:
      - netwatch_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netwatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-netwatch_dev_password}@db:5432/netwatch"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-secret-change-me}
      ALLOWED_ORIGINS: http://localhost:5173
      ALLOW_PUBLIC_SIGNUP: "true"
      SESSION_TTL_HOURS: "12"
      AGENT_STALE_SECONDS: "60"
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-only-metrics-token}
      LOG_LEVEL: INFO
      PORT: "5000"

    ports:
      - "5000:5000"

volumes:
  netwatch_pgdata: